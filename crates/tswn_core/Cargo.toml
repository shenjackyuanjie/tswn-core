[package]
name = "tswn_core"
description = "甚至是rust版名字竞技场"
version = "0.6.1"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
# 用于 fast hashmap
foldhash = "0.2.0"
mimalloc = { version = "0.1.52", optional = true }
# 用来渲染 png + base 64 编码
png = { version = "0.18", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 用来优化性能
smallvec = "1.16.0"
toml = "1.1.5"

# wasm32-unknown-unknown 上 std::time::Instant 未实现，`src/time.rs` 改用 js-sys 的
# Date::now()；该 target 由 tswn_wasm 经 wasm-bindgen 运行，链路里已有 js-sys。
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3.105"

[dev-dependencies]
png = "0.18"

[features]
default = ["png_render", "mimalloc_alloc"]
png_render = ["dep:png"]
aux_bins = []
mimalloc_alloc = ["dep:mimalloc"]
no_debug = []
# 仅供绑定的 dev-dependency 注入 Runtime validation 故障，不默认启用。
battle-test-support = []

[[bin]]
name = "tswn-cli"
path = "src/bin/tswn_cli/main.rs"

[[bin]]
name = "track_test"
path = "src/bin/track_test.rs"
required-features = ["aux_bins"]
