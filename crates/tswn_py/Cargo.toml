[package]
name = "tswn_py"
version = "0.5.4"
edition = "2024"

[dependencies]
pyo3 = { version = "0.30.1", features = ["smallvec"] }
smallvec = "1.16.3"
serde_json = "1"
serde = "1"
tswn_core = { path = "../tswn_core", features = ["no_debug", "mimalloc_alloc"] }

[lib]
name = "tswn_py"
crate-type = ["cdylib"]

[dev-dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["battle-test-support"] }
