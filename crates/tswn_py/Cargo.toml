[package]
name = "tswn_py"
version = "0.5.2"
edition = "2024"

[dependencies]
pyo3 = { version = "0.28.3", features = ["smallvec"] }
smallvec = "1.15.1"
serde_json = "1"
serde = "1"
tswn_core = { path = "../tswn_core", features = ["no_debug", "mimalloc_alloc"] }

[lib]
name = "tswn_py"
crate-type = ["cdylib"]
