[package]
name = "tswn_openbox"
description = "A simple interactive panel for common tswn tools"
version = "0.4.5"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = { version = "0.36", optional = true }
egui = { version = "0.36", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
rfd = { version = "0.17.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.5"
tswn_core = { path = "../tswn_core", default-features = false, features = ["no_debug", "png_render"] }
tswn_openbox_backend = { path = "../tswn_openbox_backend" }

[features]
default = ["mimalloc_alloc", "gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd"]
no_debug = ["tswn_core/no_debug"]
mimalloc_alloc = ["tswn_core/mimalloc_alloc"]
# 仅供界面校验：由应用自身生成截图，普通构建不编译截图驱动。
ui_capture = ["gui", "dep:image"]

[[bin]]
name = "tswn_openbox"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "openbox-cli"
path = "src/bin/openbox_cli/main.rs"
