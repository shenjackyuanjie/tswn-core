[package]
name = "tswn_winprob_dataset"
version = "0.1.0"
edition = "2024"

[dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["png_render"] }
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arrow-array = "59.3"
arrow-schema = "59.3"
parquet = { version = "59.3", default-features = false, features = ["arrow", "zstd"] }
serde_arrow = { version = "0.15", features = ["arrow-59"] }
fs2 = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tswn-winprob-dataset"
path = "src/main.rs"
