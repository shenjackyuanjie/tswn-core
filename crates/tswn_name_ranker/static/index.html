<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSWN Name Ranker</title><link rel="stylesheet" href="./style.css"></head><body><main>
<h1>TSWN Name Ranker</h1>
<section class="card"><h2>加入号</h2><p>每行一个号，保留完整名字、战队与武器文本。加入时会单独转换为 OL，以消除待测双号间的组队加成。</p><textarea id="names" rows="8" placeholder="aaa@A&#10;bbb@B"></textarea><button id="add">加入号</button><pre id="addOut"></pre></section>
<section class="card"><h2>手动扩容</h2><p>每行一个已加入数据库的完整号名。扩容号相关组合使用 ABCP &gt; 4500；其他组合仍使用 ABCP &gt; 4700。</p><textarea id="expansionNames" rows="6" placeholder="aaa@A&#10;bbb@B"></textarea><button id="addExpansion">加入扩容</button><button id="removeExpansion">移出扩容</button><pre id="expansionOut"></pre><div id="expansionList"></div></section>
<section class="card"><h2>导入带权靶子</h2><p>导入只包含靶子的 UTF-8 文本，格式为 <code>权重&lt;TAB&gt;号A+号B</code>；允许空行和以 <code>#</code> 开头的注释。靶子保持原样，不去除内部加成。</p><input id="targetFile" type="file" accept=".txt,text/plain"><textarea id="targets" rows="10" placeholder="# weight<TAB>combination&#10;1.0&#9;aaa@A+bbb@A"></textarea><button id="import">导入并替换靶子</button><pre id="targetOut"></pre></section>
<section class="card"><h2>排名</h2><p>每个待测组合对每个靶子固定模拟 10000 局。最终分数低于 48.0 的号会自动封存；封存号保留在数据库中。</p><div class="toolbar"><label>外层线程 <input id="workers" type="number" min="0" value="0"></label><label><input id="skipArchived" type="checkbox" checked> 不跑封存号</label><button id="run">开始/继续计算</button><button id="refresh">刷新结果</button><button id="export">导出详表</button></div><div class="status-line"><span id="statusBadge" class="badge idle">idle</span><span id="progressSummary">空闲</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="progress" class="progress">空闲</div><div id="results"></div></section>
</main><script src="./app.js"></script></body></html>
