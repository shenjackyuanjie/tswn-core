[package]
name = "tswn_pwp"
version = "0.0.1"
edition = "2024"

[dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["no_debug", "mimalloc_alloc", "png_render"] }
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
arrow-array = "60.0"
arrow-schema = "60.0"
parquet = { version = "60.0", default-features = false, features = ["arrow", "zstd"] }
serde_arrow = { version = "0.15", features = ["arrow-60"] }
fs2 = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "tswn-pwp"
path = "src/main.rs"
