[package]
name = "tswn_wasm"
version = "0.5.6"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
tswn_core = { path = "../tswn_core", default-features = false, features = ["no_debug", "png_render"] }
wasm-bindgen = "0.2.129"

[dev-dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["battle-test-support"] }
