[package]
name = "tswn_wasm"
version = "0.5.12"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
tswn_core = { path = "../tswn_core", default-features = false, features = ["no_debug", "png_render"] }
wasm-bindgen = "0.2.129"

[features]
# 转发 core 的 cards 能力卡子系统；默认关闭，关闭时 set_abilities 不参与编译。
cards = ["tswn_core/cards"]
# 转发 core 的 Rinick 语义补丁；默认关闭，保持冻结基线的对局结果。
hide_berserk_compat = ["tswn_core/hide_berserk_compat"]
curse_caster_charge = ["tswn_core/curse_caster_charge"]

[dev-dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["battle-test-support"] }
