[package]
name = "tswn_capi"
version = "0.6.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tswn_core = { path = "../tswn_core", features = ["no_debug", "mimalloc_alloc"] }

[lib]
name = "tswn_capi"
crate-type = ["cdylib", "staticlib"]

[dev-dependencies]
tswn_core = { path = "../tswn_core", default-features = false, features = ["battle-test-support"] }
